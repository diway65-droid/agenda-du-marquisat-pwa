<title>Agenda du Marquisat</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --rouge: #CC0000;
    --rouge-clair: #ff4444;
    --rouge-pale: #fff0f0;
    --rouge-bordure: #ffcccc;
    --noir: #111111;
    --gris-fond: #f5f5f5;
    --gris-carte: #ffffff;
    --gris-texte: #333333;
    --gris-secondaire: #777777;
    --gris-bordure: #e0e0e0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--gris-fond);
    color: var(--gris-texte);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    background: var(--noir);
    padding: 14px 16px 12px;
    border-bottom: 3px solid var(--rouge);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-row { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo svg { width: 100%; height: 100%; display: block; }
  .header-text h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 17px; font-weight: 600;
    color: #fff; letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .header-text p {
    font-size: 11px; color: var(--rouge);
    font-family: 'Source Serif 4', serif;
    font-style: italic; margin-top: 1px;
  }

  /* ── ONGLETS ── */
  .tabs {
    background: #fff; display: flex;
    border-bottom: 2px solid var(--rouge);
    position: sticky; top: 65px; z-index: 99;
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 4px;
    font-family: 'Oswald', sans-serif;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.5px; text-transform: uppercase;
    color: #aaa; cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px; transition: color 0.2s;
  }
  .tab.active { color: var(--rouge); border-bottom-color: var(--rouge); }

  /* ── SECTIONS ── */
  .section { display: none; padding: 12px; }
  .section.active { display: block; }

  /* ── CARTES ÉVÉNEMENTS ── */
  .card {
    background: var(--gris-carte);
    border-radius: 10px; border: 0.5px solid var(--gris-bordure);
    overflow: hidden; margin-bottom: 10px;
    transition: transform 0.15s; cursor: pointer;
  }
  .card:active { transform: scale(0.98); }
  .card-img { width: 100%; height: 180px; object-fit: contain; display: block; background: #f0f0f0; }
  .card-img-placeholder {
    width: 100%; height: 180px;
    background: var(--rouge-pale);
    display: flex; align-items: center; justify-content: center; font-size: 48px;
  }
  .card-body { padding: 12px 14px 14px; }
  .card-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .card-tag {
    background: var(--rouge-pale); color: var(--rouge);
    border: 0.5px solid var(--rouge-bordure);
    font-family: 'Oswald', sans-serif;
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.5px; text-transform: uppercase;
    padding: 2px 8px; border-radius: 20px;
  }
  .card-date { font-size: 11px; color: var(--gris-secondaire); font-style: italic; }
  .card-title { font-size: 16px; font-weight: 400; color: var(--gris-texte); line-height: 1.3; margin-bottom: 4px; }
  .card-desc {
    font-size: 13px; color: #555; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ── MODALE ── */
  #event-modal {
    display: none; position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 2000; overflow-y: auto; padding: 15px;
    backdrop-filter: blur(5px);
  }
  .modal-container {
    background: #fff; max-width: 440px;
    margin: 30px auto; border-radius: 15px;
    overflow: hidden; position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .modal-close {
    position: absolute; top: 15px; right: 15px;
    background: var(--rouge); color: #fff;
    border: none; border-radius: 50%;
    width: 32px; height: 32px; font-size: 18px;
    cursor: pointer; z-index: 10;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-img { width: 100%; max-height: 300px; object-fit: contain; background: #000; display: block; }
  .modal-body { padding: 20px; }
  .modal-title { font-family: 'Oswald'; font-size: 22px; color: var(--noir); margin-bottom: 10px; }
  .modal-text { line-height: 1.6; font-size: 15px; color: #444; white-space: pre-wrap; }
